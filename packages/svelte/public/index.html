<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@ai-sdk/svelte</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      color: #333;
    }
    .container {
      text-align: center;
      max-width: 600px;
      padding: 2rem;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #666;
      margin-bottom: 1.5rem;
    }
    a {
      color: #0070f3;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .links {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .links a {
      padding: 0.5rem 1rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      transition: border-color 0.2s;
    }
    .links a:hover {
      border-color: #0070f3;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>@ai-sdk/svelte</h1>
    <p>Svelte bindings for the Vercel AI SDK — build AI-powered streaming interfaces with Svelte.</p>
    <div class="links">
      <a href="https://ai-sdk.dev/docs">Documentation</a>
      <a href="https://github.com/vercel/ai">GitHub</a>
      <a href="https://www.npmjs.com/package/@ai-sdk/svelte">npm</a>
    </div>
  </div>
</body>
</html>
